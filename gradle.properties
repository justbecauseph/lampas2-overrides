# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.161.0+26.2

# Optional compatibility compile targets. They are not bundled or required unless the
# corresponding gated bridge is active at runtime.
lootr_version=1.24.41.124
fast_item_frames_version=26.2.1
puzzles_lib_version=26.2.5
gravestones_version=1.4.2+26.2+A
mob_filter_version=EDuF1CWZ
illagerblabber_version=UrxK3Zzq

# Spell crowd-control immunity. Test and GameTest only; nothing is bundled and the mixin applies to any installed Spell Engine.
