# Player Animation Library is pinned by version id, because its version number is not unique on Modrinth.
spell_engine_version=1.10.9+26.2-fabric
spell_power_version=1.6.2+26.2-fabric
cloth_config_version=26.2.155+fabric
player_animation_library_version=ZMIJpO9T
rogues_version=3.1.3.003+26.2-fabric
armor_model_api_version=1.1.2+26.2-fabric
structure_pool_api_version=1.3.0+26.2-fabric

# Mod Properties
mod_version=1.0.5
maven_group=lampas2overrides
