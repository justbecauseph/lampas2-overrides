# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.20.1
loom_version=1.17-SNAPSHOT
fabric_api_version=0.161.0+26.2

# Optional compatibility compile targets. They are not bundled or required unless the
# corresponding gated bridge is active at runtime.
# Lootr is pinned by Modrinth version ID: the version number 1.24.41.124 resolves to the NeoForge build.
# HegkPUoM is lootr-fabric-26.2-1.24.41.124.jar, the artifact the pack deploys.
lootr_version=HegkPUoM
fast_item_frames_version=26.2.1
puzzles_lib_version=26.2.5
gravestones_version=1.4.3+26.2+A
mob_filter_version=EDuF1CWZ
illagerblabber_version=UrxK3Zzq
# Voxy reverse-Z fix: the exact Voxy 0.2.19-beta and Iris 1.11.4+mc26.2 Modrinth versions the pack runs, and the
# glsl-transformer release Iris 1.11.4 bundles. Compile-only; Iris supplies glsl-transformer at runtime.
voxy_version=LzyXnE51
iris_version=gxZWWnKH
glsl_transformer_version=3.0.0-pre3

# Spell crowd-control immunity. Test and GameTest only; nothing is bundled and the mixin applies to any installed Spell Engine.
# spell_engine_version is the release SpellImpactsContractTest inspects. The Modrinth versions are the ones the pack runs.
# Player Animation Library is pinned by version id, because its version number is not unique on Modrinth.
spell_engine_version=1.10.9+26.2-fabric
spell_power_version=1.6.2+26.2-fabric
cloth_config_version=26.2.155+fabric
player_animation_library_version=HehiWi0E
rogues_version=3.1.3.003+26.2-fabric
armor_model_api_version=1.1.2+26.2-fabric
structure_pool_api_version=1.3.0+26.2-fabric

# Thrown-trident crits. Test and GameTest only; nothing is bundled and the mixins apply with any installed Critical Strike.
# critical_strike_version is the Modrinth version id of 1.0.6+26.2, the release the pack runs and CriticalStrikeContractTest inspects.
critical_strike_version=eozhJvBr

# Just Enough Filters 3.2.0 and JEI 30.48.0.244 R8 local-slot reuse fix. Test-only; nothing is bundled.
just_enough_filters_version=UHcUj9wX
jei_version=j62WSkzi

# Status Effect Bars under VanillaHUD. Test-only; StatusEffectBarsContractTest reads StatusEffectBarRenderer from this jar.
# status_effect_bars_version is the Modrinth version id of Status Effect Bars 1.0.12, the release the pack runs. The runtime
# feature is not version-gated: it applies whenever Status Effect Bars and VanillaHUD are both installed.
status_effect_bars_version=aAXJqboy

# Fancy World Animations 1.3.4 animation culling under EntityCulling 1.12.0. Compile-only; nothing is bundled from these two.
# fwa_version and entityculling_version are the Modrinth version IDs of the 26.2 builds; the gate matches the version numbers.
fwa_version=cSXDNo3Z
entityculling_version=WISXYrMc
# MixinSquared is the one library bundled into the output jar (nested with include). Its Fabric entrypoint runs the mixin canceller.
mixinsquared_version=0.3.7-beta.3

# Signs Faster 1.0.3 blank-first-line sign text fix. Test-only; SignsFasterContractTest reads the pinned jar. Nothing is bundled.
# signs_faster_version is the Modrinth version ID of Signs Faster 1.0.3 (26.2 Fabric), the build in the lampas-pipeline cache.
signs_faster_version=UsPHgp6z

# Built-in resource packs selected by default. Test-only; DefaultPacksContractTest reads these jars. Nothing is bundled.
# Modrinth version IDs of the builds the pack runs: Continuity 3.0.1+26.2, Elytra Contrails 1.6.9-26.2,
# More Bed Variants 2.2.0+26.2 (lampas-pipeline pack/mods/continuity.toml, elytratrails.toml, more-bed-variants.toml).
continuity_version=mgUN5Xz2
elytra_trails_version=MPuC5AJ2
more_bed_variants_version=xyAAI4qB

# Magic Vibe Decorations tick cancel. Test and GameTest only; nothing is bundled and the mixin applies to any installed version.
# magic_vibe_decorations_version is the Modrinth version ID of 3.0.1 (Fabric, 26.1.2-26.3), the build the pack runs.
magic_vibe_decorations_version=48BVdgry

# Custom Name /name other operator gate. Test and GameTest only; nothing is bundled and the mixin binds by string.
# custom_name_version is the Modrinth version ID of Custom Name 0.4.4-26.2, the build the pack runs (SHA-256 d70aff25...bb04).
custom_name_version=w6yXsioC

# Wall-Jump TXF elytra suppression. Test-only; WallJumpElytraContractTest reads this jar. Nothing is bundled and the
# runtime bridge binds by reflection. USvdhBa1 is walljump-26.2-1.3.8-fabric.jar (SHA-256 26855ef5...9b75).
wall_jump_txf_version=USvdhBa1

# Mod Properties
mod_version=1.0.29
maven_group=lampas2overrides
