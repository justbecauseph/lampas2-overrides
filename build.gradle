plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"lampas2-overrides" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "maven.modrinth:lootr:${project.lootr_version}"
	compileOnly "maven.modrinth:fast-item-frames:${project.fast_item_frames_version}"
	compileOnly "maven.modrinth:puzzles-lib:${project.puzzles_lib_version}"
	compileOnly "maven.modrinth:pneumono_gravestones:${project.gravestones_version}"
	compileOnly "maven.modrinth:gRn1FzwR:${project.mob_filter_version}"
	// The upstream bytecode contract test reads MixinService.class at test runtime;
	// this test-only dependency is never included in the published mod jar.
	testRuntimeOnly "maven.modrinth:gRn1FzwR:${project.mob_filter_version}"
	// Reflect the audited current schema in regression tests without bundling Trinkets.
	testRuntimeOnly "maven.modrinth:XaT8sLP6:YH8OYfzQ"
	// ASM inspects the compiled mixin contract without loading optional mod classes.
	testImplementation "org.ow2.asm:asm:9.10.1"
	// IllagerBlabber is compile-only; its bytecode contract test reads the pinned classes at test runtime.
	compileOnly "maven.modrinth:illagerblabber:${project.illagerblabber_version}"
	testRuntimeOnly "maven.modrinth:illagerblabber:${project.illagerblabber_version}"
	// The Voxy reverse-Z fix compiles against the exact Voxy and Iris artifacts it is gated to.
	compileOnly("maven.modrinth:voxy:${project.voxy_version}") { transitive = false }
	compileOnly("maven.modrinth:iris:${project.iris_version}") { transitive = false }
	compileOnly "io.github.douira:glsl-transformer:${project.glsl_transformer_version}"
	// VoxyReverseZTest runs Iris's real DepthTransformer over a Voxy-style shader patch.
	testRuntimeOnly("maven.modrinth:iris:${project.iris_version}") { transitive = false }
	testRuntimeOnly "io.github.douira:glsl-transformer:${project.glsl_transformer_version}"

	// The Spell Engine bytecode contract test reads SpellImpacts from the inspected jar. The crowd-control mixin names
	// Spell Engine only by string, so it is test-only and never bundled.
	testRuntimeOnly("maven.modrinth:spell-engine:${project.spell_engine_version}") { transitive = false }

	// Optional mods are compile-only: every compatibility feature is gated by its mixin plugin,
	// and none of their classes are bundled into the output jar.

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

fabricApi {
	// Server GameTests in src/gametest: spell crowd-control immunity with real Spell Engine, Spell Power and Rogues jars.
	configureTests {
		createSourceSet = true
		modId = 'lampas2-overrides-gametest'
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// The gametest source set and its configurations exist only once configureTests above has run. GameTest classpath only;
// the mod itself has no compile or runtime dependency on any of these.
dependencies {
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	gametestCompileOnly("maven.modrinth:spell-engine:${project.spell_engine_version}") { transitive = false }
	gametestCompileOnly("maven.modrinth:spell-power:${project.spell_power_version}") { transitive = false }
	gametestRuntimeOnly("maven.modrinth:spell-engine:${project.spell_engine_version}") { transitive = false }
	gametestRuntimeOnly("maven.modrinth:spell-power:${project.spell_power_version}") { transitive = false }
	gametestRuntimeOnly("maven.modrinth:cloth-config:${project.cloth_config_version}") { transitive = false }
	gametestRuntimeOnly("maven.modrinth:player-animation-library:${project.player_animation_library_version}") { transitive = false }
	gametestRuntimeOnly("maven.modrinth:rogues-and-warriors:${project.rogues_version}") { transitive = false }
	gametestRuntimeOnly("maven.modrinth:armor-model-api:${project.armor_model_api_version}") { transitive = false }
	gametestRuntimeOnly("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}") { transitive = false }
}

def gameTestReportFile = layout.buildDirectory.file('test-results/gameTest/TEST-lampas2-overrides-gametest.xml')

tasks.named('runGameTest') {
	systemProperty 'fabric-api.gametest.report-file', gameTestReportFile.get().asFile.absolutePath
	doFirst {
		gameTestReportFile.get().asFile.parentFile.mkdirs()
	}
}

test {
	useJUnitPlatform()
	// Opt-in checks against the dev server's deployed jars, which live outside this repository:
	// ./gradlew test -PserverModsDir=../lampas-server-fabric/mods
	def serverModsDir = providers.gradleProperty("serverModsDir").orNull
	if (serverModsDir != null) {
		systemProperty "lampas2.serverModsDir", file(serverModsDir).absolutePath
		// Gradle tracks only the path, so a changed jar behind it would leave the test task up to date.
		outputs.upToDateWhen { false }
	}
}



processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
